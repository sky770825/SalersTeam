    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwT4MIuzanc4lrIzc2Z8TJdHLfcjGkTGW3Ifh7bs-aVBG8gcxNQklApzE3nkVu_MtmH/exec';

    // 格式化數據函數
    function formatFormDataForSheets(data) {
      return [
        new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' }),
        data.name,
        data.lineId,
        data.phone,
        data.location,
        data.q1_price_perception === 'yes' ? '是' : '否',
        data.q2_large_base === 'consider' ? '會考慮' : '沒興趣',
        data.q3_safety_value === 'yes' ? '是' : '不是',
        data.q4_costco_value === 'yes' ? '一定是' : '還好',
        data.q5_ac_preference === 'full_install' ? '冷氣全部裝到好' : '只送室外機',
        data.q6_meet_event === 'high_speed_rail' ? '我要搭高鐵' : data.q6_meet_event === 'self_drive' ? '我要自行開車' : '',
        data.q7_self_visit ? '我想在直播間拿到 43萬起保留席地址' : '',
      ];
    }

    // 提交到 Google Sheets
    async function submitToGoogleSheets(data) {
      if (!GOOGLE_SCRIPT_URL) {
        console.error('Google Script URL 未设置');
        return { success: false, error: 'Google Script URL 未配置' };
      }

      try {
        const rowData = formatFormDataForSheets(data);
        console.log('准备提交数据到 Google Sheets:', { url: GOOGLE_SCRIPT_URL, data: rowData });

        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: rowData }),
        });

        console.log('请求已发送');
        return { success: true };
      } catch (error) {
        console.error('提交失败:', error);
        return { success: false, error: error.message || '提交失败，请稍后重试' };
      }

    // Questionnaire Component
    function Questionnaire({ onComplete }) {
      // 從 localStorage 恢復表單數據
      const getInitialFormData = () => {
        try {
          const saved = localStorage.getItem('beitun_form_data');
          if (saved) {
            return JSON.parse(saved);
          }
        } catch (e) {
          console.warn('無法讀取保存的表單數據:', e);
        }
        return {
          q1_price_perception: '',
          q2_large_base: '',
          q3_safety_value: '',
          q4_costco_value: '',
          q5_ac_preference: '',
          q6_meet_event: '',
          q7_self_visit: false,
          name: '',
          lineId: '',
          phone: '',
          location: ''
        };
      };

      const [formData, setFormData] = useState(getInitialFormData);
      const [errors, setErrors] = useState({});
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [submitError, setSubmitError] = useState(null);
      const [hasSubmitted, setHasSubmitted] = useState(false);

      const handleInputChange = (e) => {
        const { name, value, type } = e.target;
        let newValue;
        if (type === 'checkbox') {
          newValue = e.target.checked;
        } else {
          newValue = value;
        }
        
        const updatedData = { ...formData, [name]: newValue };
        setFormData(updatedData);
        
        // 保存到 localStorage
        try {
          localStorage.setItem('beitun_form_data', JSON.stringify(updatedData));
        } catch (e) {
          console.warn('無法保存表單數據:', e);
        }
        
        if (errors[name]) {
          setErrors(prev => ({ ...prev, [name]: undefined }));
        }
      };

      const validate = () => {
        const newErrors = {};
        if (!formData.q1_price_perception) newErrors.q1_price_perception = "請回答此問題";
        if (!formData.q2_large_base) newErrors.q2_large_base = "請回答此問題";
        if (!formData.q3_safety_value) newErrors.q3_safety_value = "請回答此問題";
        if (!formData.q4_costco_value) newErrors.q4_costco_value = "請回答此問題";
        if (!formData.q5_ac_preference) newErrors.q5_ac_preference = "請選擇冷氣方案";
        if (!formData.name.trim()) newErrors.name = "請輸入真實姓名";
        if (!formData.lineId.trim()) newErrors.lineId = "請輸入Line ID";
        
        // 增強手機號碼驗證（台灣手機號碼格式）
        const phoneRegex = /^09\d{8}$/;
        if (!formData.phone.trim()) {
          newErrors.phone = "請輸入手機號碼";
        } else if (!phoneRegex.test(formData.phone.trim())) {
          newErrors.phone = "請輸入正確的手機號碼格式（例：0912345678）";
        }
        
        if (!formData.location.trim()) newErrors.location = "請輸入居住地區";
        setErrors(newErrors);
        return Object.keys(newErrors).length === 0;
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        
        // 防重複提交
        if (hasSubmitted || isSubmitting) {
          return;
        }
        
        if (!validate()) {
          const firstError = document.querySelector('.error-message');
          firstError?.scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }

        setIsSubmitting(true);
        setSubmitError(null);
        setHasSubmitted(true);

        try {
          const result = await submitToGoogleSheets(formData);
          if (result.success) {
            console.log('表單已成功提交到 Google Sheets');
            // 清除保存的表單數據

            }
            onComplete();

            setSubmitError(result.error || '提交失敗，請稍後重試');
            setHasSubmitted(false); // 允許重試
            setIsSubmitting(false);
          }
        } catch (error) {
          console.error('提交時發生錯誤:', error);

    // Success Screen
    function SuccessScreen({ onClose }) {
      const lineUrl = "https://lin.ee/28b2R6ez";
      const message = "蔣哥，我已報名 12/27(六) 下午13:00 北屯活動，請給我最新活動地址（實名制抽大獎＋簽約大禮）";
      const [copied, setCopied] = useState(false);

      const handleCopy = async () => {
        try {
          await navigator.clipboard.writeText(message);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch (err) {
          console.error('複製失敗:', err);
          const textArea = document.createElement('textarea');
          textArea.value = message;
          textArea.style.position = 'fixed';
          textArea.style.left = '-9999px';
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          try {
            document.execCommand('copy');
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
          } catch (e) {
            console.error('傳統複製也失敗:', e);
          }
          document.body.removeChild(textArea);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 text-center animate-fade-in relative">

            <div className="mt-5 text-left bg-gray-50 border border-gray-200 rounded-2xl p-4 space-y-4">
              <div className="flex items-start gap-3">
                <div className="text-xl">📅</div>
                <div>
                  <div className="text-sm text-gray-500 font-semibold">活動時間</div>
                  <div className="text-lg font-extrabold text-gray-900">12/27（六）13:00</div>
                </div>
              </div>

              <div className="flex items-start gap-3">
                <div className="text-xl">📍</div>
                <div className="flex-1">
                  <div className="text-sm text-gray-500 font-semibold mb-1">12/27 活動地址</div>
                  <div className="text-lg font-black text-gray-900 leading-relaxed bg-yellow-50 p-3 rounded-lg border-2 border-yellow-300">
                    臺中市北屯區南興路567號

                </div>
              </div>

              <div className="rounded-xl bg-red-50 border-2 border-red-300 p-3">
                <div className="text-sm text-red-700 font-bold leading-relaxed">
                  ⚠️ 再次溫馨的提醒您～只有「實名制報名」才能參加抽獎以及當天購屋限量好禮喔！
                </div>
              </div>

              <div className="rounded-xl bg-blue-50 border border-blue-200 p-4">
                <div className="font-black text-blue-900 mb-3 text-base">🚗 交通資訊：</div>
                <div className="space-y-3 text-sm text-gray-800">
                  <div>
                    <div className="font-bold text-blue-800 mb-1">一、你可以乘坐高鐵到台中站</div>

    // Main App

    function App() {
      const [loading, setLoading] = useState(true);
      const [isSubmitted, setIsSubmitted] = useState(false);

      useEffect(() => {
        const timer = setTimeout(() => {
          setLoading(false);
        }, 2000);
        return () => clearTimeout(timer);
      }, []);

      if (loading) {
        return <LoadingScreen />;
      }

      if (isSubmitted) {
        return <SuccessScreen onClose={() => setIsSubmitted(false)} />;
      }

      return (
        <div className="min-h-screen bg-gray-100 flex flex-col font-sans">
          <div className="w-full max-w-[480px] mx-auto bg-white min-h-screen shadow-2xl overflow-hidden flex flex-col animate-fade-in">

            </footer>
          </div>
        </div>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
